# temporary: the python module on Windows with clang-cl (the MSVC ABI of PySide6), to find what has to be ported.
# Compiles everything with ninja -k 0 (all the errors in one run, not only the first) and keeps the logs as artifact
# (windows-probe: configure.log, build.log, errors.txt). It becomes the Windows wheel of the wheels job.
name: windows probe

on:
  push:
    branches: [pyside]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: windows-2025
    env:
      VCPKG_TRIPLET: x64-windows-static-md
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
      QT_VERSION: 6.12.0
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    # cl, link and the Windows SDK in the environment (clang-cl uses them)
    - uses: ilammy/msvc-dev-cmd@v1
    # restore and save apart: the cache is kept also when a later step fails
    - name: vcpkg cache
      id: vcpkg-cache
      uses: actions/cache/restore@v4
      with:
        path: vcpkg-cache
        key: vcpkg-${{ env.VCPKG_TRIPLET }}-fftw3-gsl-hdf5-cfitsio-tiff-jpeg-zlib-v1
    - name: vcpkg
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path vcpkg-cache | Out-Null
        vcpkg install "fftw3[threads]" gsl hdf5 cfitsio tiff libjpeg-turbo zlib --triplet $env:VCPKG_TRIPLET
        if ($LASTEXITCODE -ne 0) { exit 1 }
    - name: vcpkg cache save
      if: steps.vcpkg-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: vcpkg-cache
        key: vcpkg-${{ env.VCPKG_TRIPLET }}-fftw3-gsl-hdf5-cfitsio-tiff-jpeg-zlib-v1
    - name: Qt and tools
      shell: pwsh
      run: |
        python -m pip install py7zr ninja nanobind
        # (aqtinstall 3.3 doesn't know the Windows repository of Qt >= 6.12, one folder per compiler)
        python python/ci/install_qt_windows.py $env:QT_VERSION msvc2022_64 C:\Qt qtcharts qtmultimedia
        if ($LASTEXITCODE -ne 0) { exit 1 }
        Get-ChildItem C:\Qt\$env:QT_VERSION
        where.exe clang-cl
        clang-cl --version
    - name: Configure
      shell: pwsh
      run: |
        $qt = (Get-ChildItem -Directory "C:\Qt\$env:QT_VERSION\msvc*64" | Select-Object -First 1).FullName
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl `
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
          "-DVCPKG_TARGET_TRIPLET=$env:VCPKG_TRIPLET" "-DCMAKE_PREFIX_PATH=$qt" `
          -DNEUTRINO_WHEEL=ON -DNEUTRINO_PYSIDE_QT=OFF "-DPython_EXECUTABLE=$((Get-Command python).Source)" 2>&1 | Tee-Object configure.log
        if ($LASTEXITCODE -ne 0) { exit 1 }
    - name: Build (all the errors)
      shell: pwsh
      run: |
        cmake --build build --target neutrino_python -- -k 0 2>&1 | Tee-Object build.log
        "build exit code: $LASTEXITCODE" | Tee-Object -Append build.log
    - name: Errors
      if: always()
      shell: bash
      run: |
        touch build.log configure.log
        # one line per error message (the same error in many files counts once per file)
        grep -E ": (fatal )?error[: ]|error LNK|FAILED:" build.log | sed 's/\r$//' > errors.txt || true
        echo "errors: $(grep -cE ': (fatal )?error[: ]|error LNK' errors.txt || true), failed targets: $(grep -c 'FAILED:' errors.txt || true)"
        grep -E ': (fatal )?error[: ]|error LNK' errors.txt | sed -E 's/^.*: ((fatal )?error[: ].*|error LNK.*)$/\1/' | sort | uniq -c | sort -rn | head -60
        grep -q "build exit code: 0" build.log
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: windows-probe
        path: |
          configure.log
          build.log
          errors.txt
          build/CMakeCache.txt
