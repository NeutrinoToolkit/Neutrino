name: build

# Cirrus CI shut down on June 1, 2026: all its tasks (.cirrus.yml) now live here.
# Every branch is built; master publishes to the "Latest" release (tag latest),
# modernization to the "modernization" prerelease (tag latest-modernization).

on: push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive

jobs:

  ubuntu:
    continue-on-error: true
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
    - name: Git
      run: apt-get update -qq && apt-get install -yy git
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Build
      run: |
        git config --global --add safe.directory '*'
        # apt-get install -yy git file pandoc cmake qt6* libqt6* libgl1-mesa-dev libvulkan* libnetpbm10-dev libhdf5-dev libfftw3-dev libhdf4-dev  g++ build-essential libtiff5-dev libgsl-dev lsb-release libcfitsio-dev libhdf4-dev libhdf5-dev libhdf5-103 python3-dev
        apt-get install -yy git file pandoc cmake libxkbcommon-dev libgl1-mesa-dev libvulkan-dev libnetpbm11-dev libfftw3-dev libhdf4-dev g++ build-essential libtiff-dev libgsl-dev lsb-release libcfitsio-dev libhdf5-dev libxcb-xkb-dev qt6-tools-dev qt6-multimedia-dev qt6-declarative-dev qt6-charts-dev qt6-svg-dev qt6-base-private-dev python3-dev "qml6-module*"
        mkdir build && cd build
        cmake ..
        make -j$(nproc) package
        cp Neutrino*.deb ..
    - name: PythonQt logs
      if: failure()
      run: tail -n 80 build/_deps/pythonqt-build/*.log || true
    - uses: actions/upload-artifact@v4
      with:
        name: ubuntu
        path: Neutrino-*.*

  debian:
    continue-on-error: true
    runs-on: ubuntu-latest
    container: debian:testing
    steps:
    - name: Git
      run: apt-get update -qq && apt-get install -yy git
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Build
      run: |
        git config --global --add safe.directory '*'
        apt-get install -yy git file pandoc cmake libxkbcommon-dev libgl1-mesa-dev libvulkan* libnetpbm11-dev libfftw3-dev libhdf4-dev  g++ build-essential libtiff5-dev libgsl-dev lsb-release libcfitsio-dev libhdf4-dev libhdf5-dev libxcb-xkb-dev qt6-tools-dev qt6-multimedia-dev qt6-declarative-dev qt6-charts-dev qt6-svg-dev qt6-base-private-dev python3-dev
        apt-get install -yy qml6-module*
        mkdir build && cd build
        cmake ..
        make -j$(nproc) package
        cp Neutrino*.deb ..
    - name: PythonQt logs
      if: failure()
      run: tail -n 80 build/_deps/pythonqt-build/*.log || true
    - uses: actions/upload-artifact@v4
      with:
        name: debian
        path: Neutrino-*.*

  mint:
    continue-on-error: true
    runs-on: ubuntu-latest
    container: linuxmintd/mint22-amd64:latest
    steps:
    - name: Git
      run: apt-get update -qq && apt-get install -yy git
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Build
      run: |
        git config --global --add safe.directory '*'
        # apt-get install -yy git file lsb-release pandoc g++ build-essential cmake qt6* libqt6* libgl1-mesa-dev libvulkan* libnetpbm10-dev libfftw3-dev libhdf4-dev libtiff5-dev libgsl-dev libcfitsio-dev libhdf5-dev libhdf5-103 python3-dev
        apt-get install -yy git file pandoc cmake libxkbcommon-dev libgl1-mesa-dev libvulkan-dev libnetpbm11-dev libfftw3-dev libhdf4-dev g++ build-essential libtiff-dev libgsl-dev lsb-release libcfitsio-dev libhdf5-dev libxcb-xkb-dev qt6-tools-dev qt6-multimedia-dev qt6-declarative-dev qt6-charts-dev qt6-svg-dev qt6-base-private-dev python3-dev "qml6-module*"
        mkdir build && cd build
        cmake ..
        make -j$(nproc) package
        cp Neutrino*.deb ..
    - name: PythonQt logs
      if: failure()
      run: tail -n 80 build/_deps/pythonqt-build/*.log || true
    - uses: actions/upload-artifact@v4
      with:
        name: mint
        path: Neutrino-*.*

  fedora:
    continue-on-error: true
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
    - name: Git
      run: dnf -y install git
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Build
      run: |
        git config --global --add safe.directory '*'
        dnf clean all
        dnf -y --nogpgcheck update
        dnf -y install gcc gcc-c++ git qt6-* libtiff-devel gsl-devel lsb_release blas-devel pandoc hdf-devel hdf5-devel cfitsio-devel fftw3-devel rpm-build python3-devel
        mkdir build && cd build
        cmake ..
        make -j$(nproc) package
        cp Neutrino*.rpm ..
    - name: PythonQt logs
      if: failure()
      run: tail -n 80 build/_deps/pythonqt-build/*.log || true
    - uses: actions/upload-artifact@v4
      with:
        name: fedora
        path: Neutrino-*.*

  opensuse:
    continue-on-error: true
    runs-on: ubuntu-latest
    container: opensuse/tumbleweed:latest
    steps:
    - name: Git
      run: zypper install -y git tar gzip
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Build
      run: |
        git config --global --add safe.directory '*'
        zypper --non-interactive --quiet ar -C http://download.opensuse.org/repositories/science/openSUSE_Tumbleweed/science.repo
        zypper --gpg-auto-import-keys ref
        zypper update -y
        zypper install -y --force-resolution gcc gcc-c++ qt6-* lsb-release libtiff-devel gsl-devel blas-devel pandoc hdf5-devel cfitsio-devel fftw3-threads-devel rpm-build git python3-devel
        mkdir build && cd build
        cmake ..
        make -j$(nproc) package
        cp Neutrino*.rpm ..
    - name: PythonQt logs
      if: failure()
      run: tail -n 80 build/_deps/pythonqt-build/*.log || true
    - uses: actions/upload-artifact@v4
      with:
        name: opensuse
        path: Neutrino-*.*

  opensuseleap:
    continue-on-error: true
    runs-on: ubuntu-latest
    container: opensuse/leap:latest
    steps:
    - name: Git
      run: zypper install -y git tar gzip
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Build
      run: |
        git config --global --add safe.directory '*'
        # zypper --non-interactive --quiet ar -C http://download.opensuse.org/repositories/science/openSUSE_Tumbleweed/science.repo
        zypper --non-interactive --quiet ar -C https://download.opensuse.org/repositories/science/$(. /etc/os-release; echo $VERSION_ID)/science.repo
        zypper --gpg-auto-import-keys ref
        zypper update -y
        zypper install -y gcc gcc-c++ qt6-* lsb-release libtiff-devel gsl-devel blas-devel pandoc hdf5-devel cfitsio-devel fftw3-threads-devel rpm-build git python3-devel
        mkdir build && cd build
        export compiler=$(ls -1 /usr/bin/g++-[0-9][0-9])
        cmake -DCMAKE_CXX_COMPILER=$compiler  ..
        cmake ..
        make -j$(nproc) package
        cp Neutrino*.rpm ..
    - name: PythonQt logs
      if: failure()
      run: tail -n 80 build/_deps/pythonqt-build/*.log || true
    - uses: actions/upload-artifact@v4
      with:
        name: opensuseleap
        path: Neutrino-*.*

  # macIntel (was GitHub Actions) and macM1 (was Cirrus)
  mac:
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel: Homebrew no longer ships Intel bottles (qt, gcc, python...), everything builds from source for hours
        # os: [macos-15-intel, macos-15]
        os: [macos-15]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Prepare
      run: |
        brew update
        brew install objc-codegenutils objc-run
        brew install libomp git cmake fftw gcc qt lcov pkg-config zlib cmake libtiff cfitsio hdf5 gsl pandoc vulkan-headers python
        brew install boost
    - name: Deps
      run: |
        brew install --force iltommi/brews/hdf4
        brew install --force iltommi/brews/clfft
    - name: Build
      run: |
        mkdir -p build && cd build
        cmake ..
        make -j$(sysctl -n hw.ncpu) install
        ../resources/macPackage/prepareapp.sh
        cp Neutrino-*.zip Neutrino-*.dmg ..
    - name: PythonQt logs
      if: failure()
      run: tail -n 80 build/_deps/pythonqt-build/*.log || true
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.os }}
        path: |
          Neutrino-*.zip
          Neutrino-*.dmg

  # Intel Macs: Homebrew no longer ships Intel bottles, MacPorts still has prebuilt x86_64 binaries (-b: binaries only,
  # never hours of compiling). MacPorts builds them for the runner's macOS: the app needs macOS 15 or later.
  # No OpenCL/clFFT for now
  mac-intel:
    continue-on-error: true
    runs-on: macos-15-intel
    env:
      PORTS: qt6-qtbase qt6-qtsvg qt6-qtmultimedia qt6-qtdeclarative qt6-qttools qt6-qtcharts fftw-3 gsl cfitsio hdf5 hdf4 tiff pandoc python313 py313-pip libomp boost vulkan-headers zlib cmake pkgconfig
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: MacPorts
      run: |
        curl -sSL -o MacPorts.pkg https://github.com/macports/macports-base/releases/download/v2.12.7/MacPorts-2.12.7-15-Sequoia.pkg
        sudo installer -pkg MacPorts.pkg -target /
        echo /opt/local/bin >> $GITHUB_PATH
        echo /opt/local/sbin >> $GITHUB_PATH
        sudo /opt/local/bin/port -N selfupdate
        sudo /opt/local/bin/port -N -b install $PORTS
    - name: Build
      run: |
        mkdir -p build && cd build
        # /usr/local is the runner's Homebrew: keep its libraries out
        cmake .. -DCMAKE_PREFIX_PATH="/opt/local/libexec/qt6;/opt/local" -DCMAKE_IGNORE_PREFIX_PATH=/usr/local \
          -DCMAKE_DISABLE_FIND_PACKAGE_OpenCL=ON \
          -DPython_EXECUTABLE=/opt/local/bin/python3.13 -DPython3_EXECUTABLE=/opt/local/bin/python3.13 \
          -DOpenMP_C_FLAGS="-Xclang -fopenmp -I/opt/local/include/libomp" -DOpenMP_CXX_FLAGS="-Xclang -fopenmp -I/opt/local/include/libomp" \
          -DOpenMP_C_LIB_NAMES=omp -DOpenMP_CXX_LIB_NAMES=omp -DOpenMP_omp_LIBRARY=/opt/local/lib/libomp/libomp.dylib
        make -j$(sysctl -n hw.ncpu) install
        QT_BIN=/opt/local/libexec/qt6/bin DEPLOY_LIBPATHS="/opt/local/lib /opt/local/lib/libomp" ../resources/macPackage/prepareapp.sh
        cp Neutrino-*.zip Neutrino-*.dmg ..
    - name: PythonQt logs
      if: failure()
      run: tail -n 80 build/_deps/pythonqt-build/*.log || true
    - uses: actions/upload-artifact@v4
      with:
        name: macos-15-intel
        path: |
          Neutrino-*.zip
          Neutrino-*.dmg

  windows:
    strategy:
      fail-fast: false
      matrix:
        arch: [mingw32, mingw64]
    runs-on: ubuntu-latest
    container: fedora:44
    env:
      MINGW: ${{ matrix.arch }}
    steps:
    - name: Git
      run: dnf -y install git
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Build
      run: |
        git config --global --add safe.directory '*'
        dnf clean all
        dnf -y --nogpgcheck update
        dnf -y install cmake git ${MINGW}-qt6* ${MINGW}-gcc-c++ ${MINGW}-gcc ${MINGW}-gcc-gfortran ${MINGW}-libgomp ${MINGW}-gsl ${MINGW}-zlib mingw32-nsis unzip wget autoconf automake bash bison bzip2 flex gcc-c++ gdk-pixbuf2-devel gettext git gperf intltool make sed libffi-devel libtool openssl-devel p7zip patch perl pkgconfig python ruby scons unzip wget xz hostname gtk-doc dh-autoreconf ${MINGW}-libjpeg-turbo pandoc ${MINGW}-cfitsio ${MINGW}-python3 ${MINGW}-python3-numpy qt6-qtbase-devel
        wget http://www.fftw.org/fftw-3.3.6-pl2.tar.gz
        tar -zxvf fftw-3.3.6-pl2.tar.gz
        cd fftw-3.3.6-pl2
        ${MINGW}-configure --disable-static --enable-shared --enable-threads --with-combined-threads
        make -j$(nproc) bin_PROGRAMS= sbin_PROGRAMS= noinst_PROGRAMS=
        make install bin_PROGRAMS= sbin_PROGRAMS= noinst_PROGRAMS=
        cd ..
        # HDF4 4.2.10 with autotools and the MXE patches (needed -std=gnu17 -fpermissive with GCC >= 14)
        # wget https://support.hdfgroup.org/ftp/HDF/releases/HDF4.2.10/src/hdf-4.2.10.tar.bz2
        # tar -jxvf hdf-4.2.10.tar.bz2 && cd hdf-4.2.10
        # wget https://raw.githubusercontent.com/iltommi/mxe/master/src/hdf4-1-portability-fixes.patch
        # wget https://raw.githubusercontent.com/iltommi/mxe/master/src/hdf4-2-dllimport.patch
        # patch -p1 -u < hdf4-1-portability-fixes.patch
        # patch -p1 -u < hdf4-2-dllimport.patch
        # libtoolize --force
        # autoreconf --install
        # ${MINGW}-configure --disable-static --enable-shared --disable-fortran --disable-netcdf LIBS="-lportablexdr -lws2_32"  CPPFLAGS="-DH4_F77_FUNC\(name,NAME\)=NAME -DH4_BUILT_AS_DYNAMIC_LIB=1 -DBIG_LONGS" CFLAGS="$(rpm --eval %{${MINGW}_cflags}) -std=gnu17 -fpermissive"
        # make -C mfhdf/xdr LDFLAGS="-no-undefined -lssp"
        # make -C hdf/src LDFLAGS="-no-undefined -lssp"
        # make -C hdf/src install
        # make -C mfhdf/libsrc LDFLAGS="-no-undefined -ldf"
        # make -C mfhdf/libsrc install
        # cd ..
        # HDF4 >= 4.3 builds for MinGW with CMake, no patches needed (libdf is now libhdf)
        wget https://github.com/HDFGroup/hdf4/releases/download/hdf4.4.0/hdf4.4.0.tar.gz
        echo "f69afb6362529c606f05fb4c95279316497c68bea9ed7794683b31544163e286  hdf4.4.0.tar.gz" | sha256sum -c -
        tar -xzf hdf4.4.0.tar.gz
        ${MINGW}-cmake -S hdf4.4.0 -B hdf4-build -DHDF4_ONLY_SHARED_LIBS=ON -DBUILD_STATIC_LIBS=OFF -DHDF4_BUILD_TOOLS=OFF -DHDF4_BUILD_EXAMPLES=OFF -DBUILD_TESTING=OFF -DHDF4_BUILD_FORTRAN=OFF -DHDF4_BUILD_JAVA=OFF -DHDF4_ENABLE_SZIP_SUPPORT=OFF -DHDF4_NO_PACKAGES=ON
        cmake --build hdf4-build -j$(nproc) --target install
        mkdir build && cd build
        ${MINGW}-cmake ..
        make -j$(nproc) package
        cp Neutrino*.exe Neutrino*.zip ..
    - name: PythonQt logs
      if: failure()
      run: tail -n 80 build/_deps/pythonqt-build/*.log || true
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.arch }}
        path: Neutrino-*.*

  # an AppImage runs only where glibc is at least the one it was built with:
  # AppImage and AppImageArm (Fedora 44, glibc 2.43, newest Qt) for recent distributions,
  # AppImage_olderLinux and AppImageArm_olderLinux (AlmaLinux 9, glibc 2.34, Qt 6.6) for RHEL 9, Ubuntu 22.04, Debian 12 and newer
  AppImage:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AppImage
            image: fedora:44
            runner: ubuntu-latest
            arch: x86_64
            linuxdeploy: continuous
            out: ..
          - name: AppImage_olderLinux
            # image: fedora:34
            image: almalinux:9
            runner: ubuntu-latest
            arch: x86_64
            linuxdeploy: continuous
            out: ../Neutrino-olderLinux.AppImage
          - name: AppImageArm
            image: fedora:44
            runner: ubuntu-24.04-arm
            arch: aarch64
            linuxdeploy: 1-alpha-20240109-1
            out: ../Neutrino-Linux-arm64.AppImage
          - name: AppImageArm_olderLinux
            image: almalinux:9
            runner: ubuntu-24.04-arm
            arch: aarch64
            linuxdeploy: 1-alpha-20240109-1
            out: ../Neutrino-olderLinux-arm64.AppImage
    continue-on-error: ${{ matrix.name != 'AppImage' }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    env:
      VERSION: Linux
      APPIMAGE_EXTRACT_AND_RUN: 1
      LD_LIBRARY_PATH: AppDir/usr/lib
      NO_STRIP: ${{ matrix.arch == 'aarch64' && 'true' || '' }}
    steps:
    - name: Git
      run: dnf -y install git
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Build
      run: |
        git config --global --add safe.directory '*'
        # dnf -y install gcc gcc-c++ <matrix.pkgs> libtiff-devel gsl-devel blas-devel pandoc hdf-devel hdf5-devel cfitsio-devel fftw3-devel rpm-build qt6-* git wget file python3-devel python3-pip
        if grep -q '^ID="almalinux"' /etc/os-release; then dnf -y install epel-release && dnf config-manager --set-enabled crb; fi
        dnf -y install gcc gcc-c++ cmake make lsb_release libtiff-devel gsl-devel blas-devel pandoc hdf-devel hdf5-devel cfitsio-devel fftw-devel rpm-build "qt6-*-devel" git wget file python3-devel python3-pip
        wget https://github.com/linuxdeploy/linuxdeploy/releases/download/${{ matrix.linuxdeploy }}/linuxdeploy-${{ matrix.arch }}.AppImage
        wget https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/${{ matrix.linuxdeploy }}/linuxdeploy-plugin-qt-${{ matrix.arch }}.AppImage
        chmod +x linuxdeploy*.AppImage
        mkdir build && cd build
        cmake -DCMAKE_INSTALL_PREFIX=/usr -DPYSHELL_BUNDLE_PYTHON=ON ..
        make -j$(nproc) install DESTDIR=AppDir
        # libraries bundled by the pip wheels (scipy.libs, numpy.libs) find each other via $ORIGIN, linuxdeploy does not
        for d in AppDir/usr/lib/neutrino/python/*/python3*/site-packages/*.libs; do [ -d "$d" ] && LD_LIBRARY_PATH="$LD_LIBRARY_PATH:$PWD/$d"; done; export LD_LIBRARY_PATH
        ../linuxdeploy-${{ matrix.arch }}.AppImage --appdir AppDir --plugin qt --output appimage --custom-apprun=../resources/linuxPackage/AppRun --icon-file=../resources/icons/neutrino.svg
        cp Neutrino-*.AppImage ${{ matrix.out }}
    - name: PythonQt logs
      if: failure()
      run: tail -n 80 build/_deps/pythonqt-build/*.log || true
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.name }}
        path: Neutrino-*.AppImage

  # was the Cirrus upload task + EndBug/latest-tag + xresloader/upload-to-github-release
  release:
    if: ${{ !cancelled() && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/modernization') && needs.mac.result == 'success' && needs.windows.result == 'success' }}
    needs: [ubuntu, debian, mint, fedora, opensuse, opensuseleap, mac, mac-intel, windows, AppImage]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        path: package
        merge-multiple: true
    - name: Upload
      run: |
        ls -l package
        if [ "$GITHUB_REF_NAME" = "master" ]; then RELTAG=latest; else RELTAG=latest-$GITHUB_REF_NAME; fi
        # move the tag to this commit (refs/tags/ avoids clashes with a branch of the same name)
        git tag -f $RELTAG $GITHUB_SHA
        git push -f origin refs/tags/$RELTAG
        gh release view $RELTAG >/dev/null 2>&1 || gh release create $RELTAG --prerelease --title $GITHUB_REF_NAME --notes "Builds of the $GITHUB_REF_NAME branch" --verify-tag
        gh release upload --clobber $RELTAG package/*
