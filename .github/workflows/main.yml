name: macIntel

on: push
jobs:
  build:
    runs-on: macos-15-intel
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Tag latest
      if: github.ref == 'refs/heads/master'
      uses: EndBug/latest-tag@latest
      with:
        description: Latest
    - name: Tag modernization
      if: github.ref == 'refs/heads/modernization'
      uses: EndBug/latest-tag@latest
      with:
        ref: latest-modernization
        description: modernization
    - name: Prepare
      run: |
        brew update
        brew install objc-codegenutils objc-run
        brew install libomp git cmake fftw gcc qt lcov pkg-config zlib cmake libtiff cfitsio hdf5 gsl pandoc vulkan-headers python
    - name: Deps
      run: |
        brew install --force iltommi/brews/hdf4
        brew install --force iltommi/brews/clfft
    - name: Build
      run: |
        mkdir -p build && cd build
        cmake ..
        make -j$(sysctl -n hw.ncpu) install
        ../resources/macPackage/prepareapp.sh
    - name: Archive
      uses: actions/upload-artifact@v4
      with:
        name: Neutrino.zip
        path: |
          build/Neutrino*.zip
          build/Neutrino*.dmg
    - name: Upload
      if: github.ref == 'refs/heads/master'
      uses: xresloader/upload-to-github-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        file: "build/Neutrino*.zip;build/Neutrino*.dmg"
        update_latest_release: true
        overwrite: true
    - name: Upload modernization
      if: github.ref == 'refs/heads/modernization'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release view latest-modernization >/dev/null 2>&1 || gh release create latest-modernization --prerelease --title modernization --notes "Builds of the modernization branch" --target $GITHUB_SHA || true
        gh release upload --clobber latest-modernization build/Neutrino*.zip build/Neutrino*.dmg
    
