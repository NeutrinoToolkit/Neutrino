name: build

on: push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive

jobs:

  ubuntu:
    continue-on-error: true
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
    - name: Git
      run: apt-get update -qq && apt-get install -yy git
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Build
      run: |
        git config --global --add safe.directory '*'
        apt-get install -yy git file pandoc cmake libxkbcommon-dev libgl1-mesa-dev libvulkan-dev libnetpbm11-dev libfftw3-dev libhdf4-dev g++ build-essential libtiff-dev libgsl-dev lsb-release libcfitsio-dev libhdf5-dev libxcb-xkb-dev qt6-tools-dev qt6-multimedia-dev qt6-svg-dev qt6-base-private-dev python3-dev librsvg2-bin
        mkdir build && cd build
        cmake ..
        make -j$(nproc) package
        cp Neutrino*.deb ..
    - uses: actions/upload-artifact@v7
      with:
        name: ubuntu
        path: Neutrino-*.*

  debian:
    continue-on-error: true
    runs-on: ubuntu-latest
    container: debian:testing
    steps:
    - name: Git
      run: apt-get update -qq && apt-get install -yy git
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Build
      run: |
        git config --global --add safe.directory '*'
        apt-get install -yy git file pandoc cmake libxkbcommon-dev libgl1-mesa-dev libvulkan* libnetpbm11-dev libfftw3-dev libhdf4-dev  g++ build-essential libtiff5-dev libgsl-dev lsb-release libcfitsio-dev libhdf4-dev libhdf5-dev libxcb-xkb-dev qt6-tools-dev qt6-multimedia-dev qt6-svg-dev qt6-base-private-dev python3-dev librsvg2-bin
        mkdir build && cd build
        cmake ..
        make -j$(nproc) package
        cp Neutrino*.deb ..
    - uses: actions/upload-artifact@v7
      with:
        name: debian
        path: Neutrino-*.*

  mint:
    continue-on-error: true
    runs-on: ubuntu-latest
    container: linuxmintd/mint22-amd64:latest
    steps:
    - name: Git
      run: apt-get update -qq && apt-get install -yy git
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Build
      run: |
        git config --global --add safe.directory '*'
        apt-get install -yy git file pandoc cmake libxkbcommon-dev libgl1-mesa-dev libvulkan-dev libnetpbm11-dev libfftw3-dev libhdf4-dev g++ build-essential libtiff-dev libgsl-dev lsb-release libcfitsio-dev libhdf5-dev libxcb-xkb-dev qt6-tools-dev qt6-multimedia-dev qt6-svg-dev qt6-base-private-dev python3-dev librsvg2-bin
        mkdir build && cd build
        cmake ..
        make -j$(nproc) package
        for f in Neutrino*.deb; do cp "$f" "../$(echo "$f" | sed 's/-Ubuntu-/-Linuxmint-/')"; done
    - uses: actions/upload-artifact@v7
      with:
        name: mint
        path: Neutrino-*.*

  fedora:
    continue-on-error: true
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
    - name: Git
      run: dnf -y install git
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Build
      run: |
        git config --global --add safe.directory '*'
        dnf clean all
        dnf -y --nogpgcheck update
        dnf -y install gcc gcc-c++ git qt6-* libtiff-devel gsl-devel lsb_release blas-devel pandoc hdf-devel hdf5-devel cfitsio-devel fftw3-devel rpm-build python3-devel librsvg2-tools
        mkdir build && cd build
        cmake ..
        make -j$(nproc) package
        cp Neutrino*.rpm ..
    - uses: actions/upload-artifact@v7
      with:
        name: fedora
        path: Neutrino-*.*

  opensuse:
    continue-on-error: true
    runs-on: ubuntu-latest
    container: opensuse/tumbleweed:latest
    steps:
    - name: Git
      run: zypper install -y git tar gzip
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Build
      run: |
        git config --global --add safe.directory '*'
        zypper --non-interactive --quiet ar -C http://download.opensuse.org/repositories/science/openSUSE_Tumbleweed/science.repo
        zypper --gpg-auto-import-keys ref
        zypper update -y
        zypper install -y --force-resolution gcc gcc-c++ qt6-* lsb-release libtiff-devel gsl-devel blas-devel pandoc hdf5-devel cfitsio-devel fftw3-threads-devel rpm-build git python3-devel rsvg-convert
        mkdir build && cd build
        cmake ..
        make -j$(nproc) package
        cp Neutrino*.rpm ../Neutrino-Linux-x86_64-openSUSE-Tumbleweed.rpm
    - uses: actions/upload-artifact@v7
      with:
        name: opensuse
        path: Neutrino-*.*

  opensuseleap:
    continue-on-error: true
    runs-on: ubuntu-latest
    container: opensuse/leap:latest
    steps:
    - name: Git
      run: zypper install -y git tar gzip
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Build
      run: |
        git config --global --add safe.directory '*'
        zypper --non-interactive --quiet ar -C https://download.opensuse.org/repositories/science/$(. /etc/os-release; echo $VERSION_ID)/science.repo
        zypper --gpg-auto-import-keys ref
        zypper update -y
        zypper install -y gcc gcc-c++ qt6-* lsb-release libtiff-devel gsl-devel blas-devel pandoc hdf5-devel cfitsio-devel fftw3-threads-devel rpm-build git python3-devel rsvg-convert
        mkdir build && cd build
        export compiler=$(ls -1 /usr/bin/g++-[0-9][0-9])
        cmake -DCMAKE_CXX_COMPILER=$compiler  ..
        cmake ..
        make -j$(nproc) package
        cp Neutrino*.rpm ..
    - uses: actions/upload-artifact@v7
      with:
        name: opensuseleap
        path: Neutrino-*.*

  mac-arm:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Prepare
      run: |
        brew update
        brew install objc-codegenutils objc-run
        brew install libomp git cmake fftw gcc qt lcov pkg-config zlib cmake libtiff cfitsio hdf5 gsl pandoc vulkan-headers python librsvg
        brew install boost
    - name: Deps
      run: |
        brew install --force iltommi/brews/hdf4
    - name: Build
      run: |
        mkdir -p build && cd build
        cmake ..
        make -j$(sysctl -n hw.ncpu) install
        ../resources/macPackage/prepareapp.sh
        cp Neutrino-*.zip Neutrino-*.dmg ..
    - uses: actions/upload-artifact@v7
      with:
        name: macos-15
        path: |
          Neutrino-*.zip
          Neutrino-*.dmg

  mac-intel:
    continue-on-error: true
    timeout-minutes: 120
    runs-on: macos-15-intel
    env:
      PORTS: qt6-qtbase qt6-qtsvg qt6-qtmultimedia qt6-qttools fftw-3 gsl cfitsio hdf5 hdf4 tiff pandoc python313 py313-pip libomp boost vulkan-headers zlib cmake pkgconfig librsvg
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: MacPorts
      run: |
        curl -sSL -o MacPorts.pkg https://github.com/macports/macports-base/releases/download/v2.12.7/MacPorts-2.12.7-15-Sequoia.pkg
        sudo installer -pkg MacPorts.pkg -target /
        echo /opt/local/bin >> $GITHUB_PATH
        echo /opt/local/sbin >> $GITHUB_PATH
        sudo /opt/local/bin/port -N selfupdate
        sudo /opt/local/bin/port -N install $PORTS
    - name: Build
      run: |
        mkdir -p build && cd build
        cmake .. -DCMAKE_PREFIX_PATH="/opt/local/libexec/qt6;/opt/local" -DCMAKE_IGNORE_PREFIX_PATH=/usr/local \
          -DPython_EXECUTABLE=/opt/local/bin/python3.13 -DPython3_EXECUTABLE=/opt/local/bin/python3.13 \
          -DOpenMP_C_FLAGS="-Xclang -fopenmp -I/opt/local/include/libomp" -DOpenMP_CXX_FLAGS="-Xclang -fopenmp -I/opt/local/include/libomp" \
          -DOpenMP_C_LIB_NAMES=omp -DOpenMP_CXX_LIB_NAMES=omp -DOpenMP_omp_LIBRARY=/opt/local/lib/libomp/libomp.dylib
        make -j$(sysctl -n hw.ncpu) install
        QT_BIN=/opt/local/libexec/qt6/bin DEPLOY_LIBPATHS="/opt/local/lib /opt/local/lib/libomp" ../resources/macPackage/prepareapp.sh
        cp Neutrino-*.zip Neutrino-*.dmg ..
    - uses: actions/upload-artifact@v7
      with:
        name: macos-15-intel
        path: |
          Neutrino-*.zip
          Neutrino-*.dmg

  windows:
    strategy:
      fail-fast: false
      matrix:
        arch: [mingw32, mingw64]
    runs-on: ubuntu-latest
    container: fedora:44
    env:
      MINGW: ${{ matrix.arch }}
    steps:
    - name: Git
      run: dnf -y install git
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Build
      run: |
        git config --global --add safe.directory '*'
        dnf clean all
        dnf -y --nogpgcheck update
        dnf -y install cmake git ${MINGW}-qt6* ${MINGW}-gcc-c++ ${MINGW}-gcc ${MINGW}-gcc-gfortran ${MINGW}-libgomp ${MINGW}-gsl ${MINGW}-zlib mingw32-nsis unzip wget autoconf automake bash bison bzip2 flex gcc-c++ gdk-pixbuf2-devel gettext git gperf intltool make sed libffi-devel libtool openssl-devel p7zip patch perl pkgconfig python ruby scons unzip wget xz hostname gtk-doc dh-autoreconf ${MINGW}-libjpeg-turbo pandoc ${MINGW}-cfitsio qt6-qtbase-devel librsvg2-tools
        wget http://www.fftw.org/fftw-3.3.6-pl2.tar.gz
        tar -zxvf fftw-3.3.6-pl2.tar.gz
        cd fftw-3.3.6-pl2
        ${MINGW}-configure --disable-static --enable-shared --enable-threads --with-combined-threads
        make -j$(nproc) bin_PROGRAMS= sbin_PROGRAMS= noinst_PROGRAMS=
        make install bin_PROGRAMS= sbin_PROGRAMS= noinst_PROGRAMS=
        cd ..
        wget https://github.com/HDFGroup/hdf4/releases/download/hdf4.4.0/hdf4.4.0.tar.gz
        echo "f69afb6362529c606f05fb4c95279316497c68bea9ed7794683b31544163e286  hdf4.4.0.tar.gz" | sha256sum -c -
        tar -xzf hdf4.4.0.tar.gz
        ${MINGW}-cmake -S hdf4.4.0 -B hdf4-build -DHDF4_ONLY_SHARED_LIBS=ON -DBUILD_STATIC_LIBS=OFF -DHDF4_BUILD_TOOLS=OFF -DHDF4_BUILD_EXAMPLES=OFF -DBUILD_TESTING=OFF -DHDF4_BUILD_FORTRAN=OFF -DHDF4_BUILD_JAVA=OFF -DHDF4_ENABLE_SZIP_SUPPORT=OFF -DHDF4_NO_PACKAGES=ON
        cmake --build hdf4-build -j$(nproc) --target install
        mkdir build && cd build
        ${MINGW}-cmake ..
        make -j$(nproc) package
        cp Neutrino*.exe Neutrino*.zip ..
    - uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.arch }}
        path: Neutrino-*.*

  AppImage:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AppImage
            image: fedora:44
            runner: ubuntu-latest
            arch: x86_64
            linuxdeploy: continuous
            out: ..
          - name: AppImage_olderLinux
            image: almalinux:9
            runner: ubuntu-latest
            arch: x86_64
            linuxdeploy: continuous
            out: ../Neutrino-olderLinux-x86_64.AppImage
          - name: AppImageArm
            image: fedora:44
            runner: ubuntu-24.04-arm
            arch: aarch64
            linuxdeploy: 1-alpha-20240109-1
            out: ../Neutrino-Linux-arm64.AppImage
          - name: AppImageArm_olderLinux
            image: almalinux:9
            runner: ubuntu-24.04-arm
            arch: aarch64
            linuxdeploy: 1-alpha-20240109-1
            out: ../Neutrino-olderLinux-arm64.AppImage
    continue-on-error: ${{ matrix.name != 'AppImage' }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    env:
      VERSION: Linux
      APPIMAGE_EXTRACT_AND_RUN: 1
      LD_LIBRARY_PATH: AppDir/usr/lib
      NO_STRIP: ${{ matrix.arch == 'aarch64' && 'true' || '' }}
    steps:
    - name: Git
      run: dnf -y install git
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Build
      run: |
        git config --global --add safe.directory '*'
        if grep -q '^ID="almalinux"' /etc/os-release; then dnf -y install epel-release && dnf config-manager --set-enabled crb; fi
        dnf -y install gcc gcc-c++ cmake make lsb_release libtiff-devel gsl-devel blas-devel pandoc hdf-devel hdf5-devel cfitsio-devel fftw-devel rpm-build "qt6-*-devel" git wget file python3-devel python3-pip librsvg2-tools
        # EPEL 9 pandoc is 2.14 (no --embed-resources, needs >= 2.19): use the official static pandoc instead
        if grep -q '^ID="almalinux"' /etc/os-release; then
          dnf -y remove pandoc pandoc-common
          PANDOC_ARCH=$([ "${{ matrix.arch }}" = aarch64 ] && echo arm64 || echo amd64)
          wget https://github.com/jgm/pandoc/releases/download/3.7.0.2/pandoc-3.7.0.2-linux-${PANDOC_ARCH}.tar.gz
          grep "linux-${PANDOC_ARCH}" <<'EOF' | sha256sum -c -
        8f8f67fdd540b6519326b0ac49d5c55c5d5d15e43920e80a086e02c8aff83268  pandoc-3.7.0.2-linux-amd64.tar.gz
        4ef2997ff0fa7f86ada5a217722f4f732293e38518b4442ececce16628bd0e44  pandoc-3.7.0.2-linux-arm64.tar.gz
        EOF
          tar -xzf pandoc-3.7.0.2-linux-${PANDOC_ARCH}.tar.gz --strip-components=1 -C /usr/local
          rm pandoc-3.7.0.2-linux-${PANDOC_ARCH}.tar.gz
        fi
        pandoc --version | head -1
        wget https://github.com/linuxdeploy/linuxdeploy/releases/download/${{ matrix.linuxdeploy }}/linuxdeploy-${{ matrix.arch }}.AppImage
        wget https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/${{ matrix.linuxdeploy }}/linuxdeploy-plugin-qt-${{ matrix.arch }}.AppImage
        chmod +x linuxdeploy*.AppImage
        mkdir build && cd build
        cmake -DCMAKE_INSTALL_PREFIX=/usr ..
        make -j$(nproc) install DESTDIR=AppDir
        ../linuxdeploy-${{ matrix.arch }}.AppImage --appdir AppDir --plugin qt --output appimage --custom-apprun=../resources/linuxPackage/AppRun --icon-file=../resources/icons/neutrino.svg
        cp Neutrino-*.AppImage ${{ matrix.out }}
    - uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.name }}
        path: Neutrino-*.AppImage

  # the python module (pip install neutrino-toolkit): cibuildwheel, configured in pyproject.toml ([tool.cibuildwheel])
  wheels:
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: wheel-linux-x86_64
          - os: ubuntu-24.04-arm
            name: wheel-linux-aarch64
          - os: macos-15
            name: wheel-macos-arm64
          - os: macos-15-intel
            name: wheel-macos-x86_64
          - os: windows-2025
            name: wheel-windows-x86_64
    runs-on: ${{ matrix.os }}
    env:
      # Windows: the packages built by vcpkg (python/ci/before_all_windows.sh), cached
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    # Windows: cl, link and the Windows SDK in the environment (used by clang-cl)
    - uses: ilammy/msvc-dev-cmd@v1
      if: runner.os == 'Windows'
    # restore and save apart: the cache is kept also when the build fails
    - name: vcpkg cache
      if: runner.os == 'Windows'
      id: vcpkg-cache
      uses: actions/cache/restore@v6
      with:
        path: vcpkg-cache
        key: vcpkg-x64-windows-static-md-${{ hashFiles('python/ci/before_all_windows.sh') }}
    - name: vcpkg cache directory
      if: runner.os == 'Windows'
      shell: bash
      run: mkdir -p vcpkg-cache
    # major.minor of pyproject.toml + the commits since its change (python/ci/version.py)
    - name: Version
      shell: bash
      run: |
        if [ "$RUNNER_OS" = Windows ]; then PY=python; else PY=python3; fi
        $PY python/ci/version.py --write
    - name: Build and test
      run: pipx run "cibuildwheel>=3.1,<4" --output-dir wheelhouse
    - name: vcpkg cache save
      if: always() && runner.os == 'Windows' && steps.vcpkg-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: vcpkg-cache
        key: vcpkg-x64-windows-static-md-${{ hashFiles('python/ci/before_all_windows.sh') }}
    - uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.name }}
        path: wheelhouse/*.whl

  # the wheels on PyPI (pip install neutrino-toolkit): only the first version of a new major.minor (the version line
  # of pyproject.toml changed), from master or modernization. The other versions are in the GitHub releases
  # trusted publishing: pypi.org, Publishing, publisher NeutrinoToolkit/Neutrino, workflow main.yml, environment pypi
  pypi-check:
    if: ${{ !cancelled() && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/modernization') }}
    needs: [wheels]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Check PyPI
      id: check
      run: |
        version=$(python3 python/ci/version.py)
        echo "version=$version" >> $GITHUB_OUTPUT
        # publish when PyPI has no version with this major.minor (also retried at the next push if it failed)
        python3 - "$version" >> $GITHUB_OUTPUT <<'EOF'
        import json, sys, urllib.error, urllib.request
        major_minor = sys.argv[1].rsplit(".", 1)[0]
        try:
            releases = json.load(urllib.request.urlopen("https://pypi.org/pypi/neutrino-toolkit/json"))["releases"]
        except urllib.error.HTTPError as e:
            if e.code != 404:
                raise
            releases = {}  # not on PyPI yet
        published = [v for v in releases if v.rsplit(".", 1)[0] == major_minor]
        print("publish=" + ("false" if published else "true"))
        print(f"{sys.argv[1]}: PyPI has {published or 'no ' + major_minor + '.*'}", file=sys.stderr)
        EOF

  pypi:
    if: ${{ !cancelled() && needs.pypi-check.outputs.publish == 'true' }}
    needs: [pypi-check]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/neutrino-toolkit
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@v8
      with:
        pattern: wheel-*
        path: dist
        merge-multiple: true
    - name: Check wheels
      run: |
        ls -l dist
        # all the wheels (the wheels jobs are continue-on-error): 3 pythons x 5 platforms, of this version
        n=$(ls dist/neutrino_toolkit-${{ needs.pypi-check.outputs.version }}-*.whl | wc -l)
        if [ $n -ne 15 ] || [ $(ls dist | wc -l) -ne 15 ]; then echo "$n wheels of ${{ needs.pypi-check.outputs.version }} instead of 15"; exit 1; fi
    - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    if: ${{ !cancelled() && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/modernization') && needs.mac-arm.result == 'success' && needs.windows.result == 'success' }}
    # needs: [ubuntu, debian, mint, fedora, opensuse, opensuseleap, mac-arm, mac-intel, windows, AppImage]
    needs: [ubuntu, debian, mint, fedora, opensuse, opensuseleap, mac-arm, mac-intel, windows, AppImage, wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        path: package
        merge-multiple: true
    - name: Upload
      run: |
        ls -l package
        if [ "$GITHUB_REF_NAME" = "master" ]; then RELTAG=latest; else RELTAG=latest-$GITHUB_REF_NAME; fi
        git tag -f $RELTAG $GITHUB_SHA
        git push -f origin refs/tags/$RELTAG
        gh release view $RELTAG >/dev/null 2>&1 || gh release create $RELTAG --prerelease --title $GITHUB_REF_NAME --notes "Builds of the $GITHUB_REF_NAME branch" --verify-tag
        gh release upload --clobber $RELTAG package/*
        # the wheels of the previous builds (other version numbers): removed after the upload, only if this build has
        # all of them (15, as in the pypi job; otherwise a platform whose wheel failed would have none)
        if [ "$(ls package/neutrino_toolkit-*.whl 2>/dev/null | wc -l)" -eq 15 ]; then
          gh release view $RELTAG --json assets -q '.assets[].name' | grep '^neutrino_toolkit-.*\.whl$' | while read -r asset; do
            [ -e "package/$asset" ] || gh release delete-asset $RELTAG "$asset" --yes
          done
        fi
